<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  .scene{position:relative;width:1000px;height:1000px;overflow:hidden;
    background:radial-gradient(circle at 50% 42%,#fffdf6 0%,#fbf3df 55%,#f3e6c6 100%);}
  .card{position:absolute;width:236px;height:356px;border-radius:16px;overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,.08),0 18px 30px -12px rgba(60,40,10,.45);background:#fff}
  .card img{width:100%;height:100%;display:block}
  .fan .card{left:382px;top:96px;transform-origin:50% 190%}
  /* Dos de carte : bandes pastel en diagonale, titre au centre */
  .back{background:repeating-linear-gradient(-58deg,
     #f2b3a0 0 44px,#bcd99c 44px 88px,#dbe6ee 88px 132px,#f7e39c 132px 176px,
     #f5c393 176px 220px,#cfb8e6 220px 264px,#fbf5e4 264px 308px);
    display:grid;place-content:center;text-align:center}
  .back b{white-space:nowrap;font:400 31px/1 Anton,Impact,sans-serif;letter-spacing:.3px;color:#161412}
  .back span{font:400 19px/1.25 'Open Sans',sans-serif;color:#161412;margin-top:4px}
  .deck{position:absolute;left:330px;top:560px;width:236px;height:356px;transform:rotate(-9deg)}
  .deck .card{position:absolute;left:0;top:0}
</style></head><body>
<div class="scene" id="scene">
  <div class="fan" id="fan"></div>
  <div class="deck" id="deck"></div>
</div>
<script>
  const cards=['guigui-bouffetout','guigui-botefragile','dim-ludick','laurent-branquignol','donne-gochofacho','dim-gaulois','dauby-izikarate'];
  const fan=document.getElementById('fan');
  cards.forEach((c,i)=>{
    const a=(i-3)*14, el=document.createElement('div');
    el.className='card';el.style.transform=`translateY(0) rotate(${a}deg)`;el.style.zIndex=i;
    el.innerHTML=`<img src="c/${c}.png">`;fan.appendChild(el);
  });
  const deck=document.getElementById('deck');
  for(let k=7;k>=0;k--){
    const el=document.createElement('div');el.className='card back';
    el.style.transform=`rotate(-7deg) translate(${k*1.6}px,${k*2.4}px)`;
    if(k>0){el.style.background='#f4efe6';el.style.boxShadow='0 1px 0 rgba(0,0,0,.12)'}
    else el.innerHTML='<b>LA GRANDE ARMÉE</b><span>Le jeu des 7 familles</span>';
    deck.appendChild(el);
  }
</script>
</body></html>
