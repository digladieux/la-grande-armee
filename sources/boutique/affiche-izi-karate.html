<!doctype html>
<!-- Visuel boutique « Affiche personnalisée » (public/images/boutique/affiche-izi-karate.webp, 1000×1000) :
     l'affiche Izi Karaté (sources/affiches/familles/izi-karate.jpg) scotchée au mur. Rendu : capture 1000×1000. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:1000px;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#fbf3e0 0%,#f3e6c8 75%,#ecdcba 100%);display:grid;place-items:center}
.poster{position:relative;width:870px;transform:rotate(-1.4deg);box-shadow:0 2px 3px rgb(0 0 0/.12),0 26px 40px -18px rgb(70 45 10/.45)}
.poster img{display:block;width:100%}
.tape{position:absolute;top:-22px;width:120px;height:40px;background:rgb(250 243 214/.78);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.tape.l{left:-34px;transform:rotate(-28deg)}
.tape.r{right:-34px;transform:rotate(28deg)}
</style></head><body>
<div class="poster"><img src="../affiches/familles/izi-karate.jpg"><span class="tape l"></span><span class="tape r"></span></div>
</body></html>
